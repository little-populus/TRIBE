OPTIM:
  METHOD: Adam
  STEPS: 1
  BETA: 0.9
  WD: 0.

ADAPTER:
  NAME: tribe
  TRIBE:
    ETA: 0.01      # 0.01 on CIFAR10, 0.05 on CIFAR100, 0.5 on ImageNet1K. This term is related with the number of categories. [Roughly follow max(0.0005 * K., 0.01)]
    GAMMA: 0.     # 0.0 on CIFAR10, 0.1 on CIFAR100, 0.5 on ImageNet1K. More details please see the paper. [Little sensitive]
    H0: 0.05       # 0.05 on CIFAR10, 0.2 on CIFAR100, 0.4 on ImageNet1K. Entropy threshold is related with the accuracy of source domain. [Not sensitive]
    LAMBDA: 0.5    # This term is usually constant as 0.5
    # ---- improvement switches (defaults reproduce the original TRIBE) ----
    SOFT_BN: False   # true: probability-weighted (soft) pseudo labels for Balanced BN statistics
    SOFT_TAU: 1.0    # temperature on teacher logits for the soft weights (<1 sharper, >1 softer)
    CB_LOSS: False   # true: class-balanced inverse-frequency weighting of the ST / anchor losses
    CB_BETA: 0.5     # exponent of inverse-frequency weights (1.0 full inverse, 0.5 sqrt)
    ANCHOR_TYPE: 'mse'  # anchor loss type: 'mse' (original) or 'kl'
    ADAPT_MOM: False  # true: per-class adaptive BN momentum (helps rare classes under large I.F.)
    ADAPT_MOM_C: 1.0  # m_k = clamp(c / cum_count_k, ETA, MOM_MAX)
    MOM_MAX: 0.25     # upper bound of the adaptive momentum
    TLA: False        # true: test-time logit adjustment with online class-prior estimation
    TLA_TAU: 1.0      # correction strength (1.0 = Bayes-consistent logit adjustment)
    TLA_ALPHA: 1.0    # Laplace smoothing of the estimated prior
    TLA_WARMUP: 100   # pseudo-labels collected before the correction activates
    TLA_MODE: 'both'  # 'both': correct prediction + training signal; 'train': training signal only
    SHIFT_WARMUP: False  # true: boost BN momentum for a few batches after a detected domain switch
    SHIFT_BOOST: 8.0     # momentum multiplier during the re-warm window
    SHIFT_WARMUP_T: 10   # number of boosted batches after each detected switch
    SHIFT_DELTA: 0.3     # relative jump of the shift signal that triggers re-warming
    ENSEMBLE: False      # true: blend teacher prediction with the anchor view
    ENSEMBLE_W: 0.3      # anchor weight in the ensemble output

